<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Text to Visuals{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-2: #f1f3f5;
            --border: #e4e7eb;
            --border-strong: #d3d8de;
            --text: #16181d;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-soft: #eef2ff;
            --accent-contrast: #ffffff;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --success: #16a34a;
            --success-soft: #f0fdf4;
            --warn: #b45309;
            --warn-soft: #fffbeb;
            --info: #2563eb;
            --info-soft: #eff6ff;
            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
            --shadow-lg: 0 8px 30px rgba(16, 24, 40, .12);
        }
        [data-theme="dark"] {
            --bg: #0e1013;
            --surface: #16191f;
            --surface-2: #1d2129;
            --border: #262b34;
            --border-strong: #333a45;
            --text: #e7e9ec;
            --text-muted: #9aa1ad;
            --accent: #818cf8;
            --accent-hover: #a5b4fc;
            --accent-soft: #1c2030;
            --accent-contrast: #0e1013;
            --danger: #f87171;
            --danger-soft: #2a1414;
            --success: #4ade80;
            --success-soft: #10231a;
            --warn: #fbbf24;
            --warn-soft: #241c0d;
            --info: #60a5fa;
            --info-soft: #10203a;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .35);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, .5);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background .2s ease, color .2s ease;
        }
        a { color: var(--accent); text-decoration: none; }

        .navbar {
            position: sticky; top: 0; z-index: 20;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px;
            background: color-mix(in srgb, var(--surface) 88%, transparent);
            backdrop-filter: saturate(160%) blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
        .brand .logo {
            width: 30px; height: 30px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: grid; place-items: center; color: #fff;
        }
        .brand .logo svg { width: 18px; height: 18px; }
        .nav-actions { display: flex; align-items: center; gap: 10px; }

        .container { max-width: 960px; margin: 0 auto; padding: 36px 24px 80px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font: inherit; font-weight: 500; font-size: 14px;
            padding: 10px 18px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
            cursor: pointer; transition: all .15s ease; white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent); background: var(--surface-2); }
        .btn:active { transform: translateY(1px); }
        .btn svg { width: 16px; height: 16px; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
        .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
        .btn-icon { padding: 9px; border-radius: var(--radius-sm); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
        }

        input[type="text"], textarea {
            width: 100%; font: inherit; color: var(--text);
            background: var(--surface); border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm); padding: 13px 15px; transition: border .15s, box-shadow .15s;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
        }
        ::placeholder { color: var(--text-muted); }

        .muted { color: var(--text-muted); }
        .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0 0 12px; }

        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 13px; font-size: 13px; border-radius: 999px;
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text); cursor: pointer; transition: all .15s;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }

        .code-block {
            position: relative; background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 16px 16px; overflow-x: auto;
            font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13.5px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word;
        }
        .copy-btn { position: absolute; top: 10px; right: 10px; }

        .pill-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .pill {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; font-size: 14px; font-weight: 500;
            border-radius: 999px; border: 1px solid var(--border-strong);
            background: var(--surface); color: var(--text); cursor: pointer; transition: all .15s;
        }
        .pill:hover { border-color: var(--accent); background: var(--accent-soft); }
        .pill svg { width: 16px; height: 16px; opacity: .8; }
        .pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
        .pill.active svg { opacity: 1; }

        .alert { border-radius: var(--radius-sm); padding: 13px 16px; font-size: 14px; border: 1px solid; margin: 0 0 4px; }
        .alert-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 35%, transparent); color: var(--info); }
        .alert-danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); }
        .alert-warning { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
        .alert-success { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 35%, transparent); color: var(--success); }

        .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 460px; }
        table.table, .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        table.table th, .table-wrap table th {
            position: sticky; top: 0; background: var(--surface-2); text-align: left;
            font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        table.table td, .table-wrap table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .table-wrap tr:last-child td { border-bottom: none; }
        .table-wrap tbody tr:hover td, .table-wrap tr:hover td { background: var(--surface-2); }

        .spinner {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
            border-top-color: var(--accent); animation: spin .7s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .skeleton {
            border-radius: var(--radius-sm);
            background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
            background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
        }
        @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        .overlay {
            position: fixed; inset: 0; z-index: 50; display: none;
            place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent);
            backdrop-filter: blur(3px);
        }
        .overlay.show { display: grid; }
        .overlay .box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .overlay .spinner { width: 34px; height: 34px; border-width: 3.5px; }

        .icon-sun, .icon-moon { width: 18px; height: 18px; }
        [data-theme="dark"] .icon-moon { display: none; }
        [data-theme="light"] .icon-sun { display: none; }

        .fade-in { animation: fade .3s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }
        h2 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('main.upload_file') }}" class="brand">
            <span class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/></svg>
            </span>
            Text&nbsp;to&nbsp;Visuals
        </a>
        <div class="nav-actions">
            {% block nav_actions %}{% endblock %}
            <button type="button" class="btn btn-icon" onclick="toggleTheme()" aria-label="Toggle theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleTheme() {
            var cur = document.documentElement.getAttribute("data-theme");
            var next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
